# 注意：name 只允许小写字母/数字/连字符，中文会导致构建直接失败
name = "data-workspace"
pages_build_output_dir = "pages"
compatibility_date = "2026-05-01"

[vars]
ENV = "production"

# KV 绑定（Pages Git 集成模式下由本文件统一管理，push 后自动生效）
# id 填 Cloudflare 控制台 KV namespace 的 ID：
#   Workers & Pages → KV → 选中（或新建）一个 namespace → 复制其 ID
# 代码里通过 env.KV 访问，binding 名必须是 KV
[[kv_namespaces]]
binding = "KV"
id = "f72669c5031f425697e04de70755aef0"

# 本地调试：wrangler pages dev pages --kv KV